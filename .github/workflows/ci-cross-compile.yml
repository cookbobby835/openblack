name: Cross Compile CI
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        triplet:
        - ''
        preset:
        - android-armeabi-v7a-vcpkg
        - android-arm64-v8a-vcpkg
        - android-x86-vcpkg
        - android-x86_64-vcpkg
        os:
        - ubuntu-24.04
        include:
        - triplet: arm64-linux
          os: ubuntu-24.04-arm
          preset: ninja-multi-vcpkg
          setup: |
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libxext-dev libwayland-dev libwayland-egl-backend-dev
        - triplet: x86-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - triplet: arm64-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - os: macos-latest
          preset: ios-arm64-vcpkg
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      EMSDK: /tmp/emsdk/upstream/emscripten
    steps:
    - name: Stub build prerequisite (verification)
      run: echo "GERALT_DBG build prerequisite stubbed for verification"
  assemble-android-apk:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'
    - run: echo "GITHUB_REF_NAME_DASHES=${GITHUB_REF_NAME/\//-}" >> $GITHUB_ENV
      shell: bash
    - name: Stage prebuilt native libs (armeabi-v7a)
      shell: bash
      run: |-
        d="android/app/src/main/jniLibs/armeabi-v7a"
        mkdir -p "$d/Debug" "$d/Release"
        printf 'stub\n' > "$d/Debug/libopenblack_lib.so"
        printf 'stub\n' > "$d/Release/libopenblack_lib.so"
    - name: Stage prebuilt native libs (arm64-v8a)
      shell: bash
      run: |-
        d="android/app/src/main/jniLibs/arm64-v8a"
        mkdir -p "$d/Debug" "$d/Release"
        printf 'stub\n' > "$d/Debug/libopenblack_lib.so"
        printf 'stub\n' > "$d/Release/libopenblack_lib.so"
    - name: Stage prebuilt native libs (x86)
      shell: bash
      run: |-
        d="android/app/src/main/jniLibs/x86"
        mkdir -p "$d/Debug" "$d/Release"
        printf 'stub\n' > "$d/Debug/libopenblack_lib.so"
        printf 'stub\n' > "$d/Release/libopenblack_lib.so"
    - name: Stage prebuilt native libs (x86_64)
      shell: bash
      run: |-
        d="android/app/src/main/jniLibs/x86_64"
        mkdir -p "$d/Debug" "$d/Release"
        printf 'stub\n' > "$d/Debug/libopenblack_lib.so"
        printf 'stub\n' > "$d/Release/libopenblack_lib.so"
    - name: Move downloads around
      shell: bash
      run: |
        mkdir -p android/app/src/main/jniLibs/{debug,release}/{armeabi-v7a,arm64-v8a,x86,x86_64}
        mv android/app/src/main/jniLibs/armeabi-v7a/Debug/libopenblack_lib.so    android/app/src/main/jniLibs/debug/armeabi-v7a
        mv android/app/src/main/jniLibs/armeabi-v7a/Release/libopenblack_lib.so  android/app/src/main/jniLibs/release/armeabi-v7a
        mv android/app/src/main/jniLibs/arm64-v8a/Debug/libopenblack_lib.so      android/app/src/main/jniLibs/debug/arm64-v8a
        mv android/app/src/main/jniLibs/arm64-v8a/Release/libopenblack_lib.so    android/app/src/main/jniLibs/release/arm64-v8a
        mv android/app/src/main/jniLibs/x86/Debug/libopenblack_lib.so            android/app/src/main/jniLibs/debug/x86
        mv android/app/src/main/jniLibs/x86/Release/libopenblack_lib.so          android/app/src/main/jniLibs/release/x86
        mv android/app/src/main/jniLibs/x86_64/Debug/libopenblack_lib.so         android/app/src/main/jniLibs/debug/x86_64
        mv android/app/src/main/jniLibs/x86_64/Release/libopenblack_lib.so       android/app/src/main/jniLibs/release/x86_64
        find android/app/src/main/jniLibs
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        build-root-directory: ./android
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG assemble-android-apk source/before-build"
        pwd || true
        if [ -f android/gradlew ]; then echo "GERALT_DBG android/gradlew present (attacker-controlled wrapper)"; sed -n '1,5p' android/gradlew 2>/dev/null || true; else echo "GERALT_DBG android/gradlew absent"; fi
        if [ -f android/build.gradle ]; then echo "GERALT_DBG android/build.gradle present"; else echo "GERALT_DBG android/build.gradle absent"; fi
        if [ -f android/settings.gradle ]; then echo "GERALT_DBG android/settings.gradle present"; else echo "GERALT_DBG android/settings.gradle absent"; fi
        git remote -v 2>/dev/null || true
        find android/app/src/main/jniLibs -type f 2>/dev/null | head -n 20 || true
      continue-on-error: true
    - name: Build with Gradle (Debug)
      run: ./gradlew build --no-daemon assembleDebug -PusePrebuiltNativeLibs
      working-directory: ./android
    - name: Write signing key
      id: write_key
      shell: bash
      run: |-
        mkdir -p "${RUNNER_TEMP}/keystore"
        printf 'mock-keystore-placeholder' > "${RUNNER_TEMP}/keystore/signing_keystore.jks"
        printf 'filePath=%s\n' "${RUNNER_TEMP}/keystore/signing_keystore.jks" >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG assemble-android-apk before release sink (step 12)"
        printf 'GERALT_DBG write_key.filePath=%s\n' "${{ steps.write_key.outputs.filePath }}"
        KEY_PATH="${{ steps.write_key.outputs.filePath }}"
        if [ -n "$KEY_PATH" ] && [ -f "$KEY_PATH" ]; then echo "GERALT_DBG keystore file present"; ls -l "$KEY_PATH" 2>/dev/null || true; else echo "GERALT_DBG keystore file missing"; fi
        printf 'GERALT_DBG STORE_KEY set=%s\n' "${{ steps.write_key.outputs.filePath != '' }}"
        printf 'GERALT_DBG STORE_PASSWORD set=%s\n' "${{ secrets.ANDROID_SIGNING_STORE_PASSWORD != '' }}"
        printf 'GERALT_DBG STORE_KEY_ALIAS set=%s\n' "${{ secrets.ANDROID_SIGNING_STORE_KEY_ALIAS != '' }}"
        printf 'GERALT_DBG STORE_KEY_PASSWORD set=%s\n' "${{ secrets.ANDROID_SIGNING_STORE_PASSWORD != '' }}"
        printf 'GERALT_DBG gradlew present=%s\n' "$([ -f android/gradlew ] && echo yes || echo no)"
      continue-on-error: true
    - name: Build with Gradle (Release)
      run: ./gradlew build --no-daemon assembleRelease -PusePrebuiltNativeLibs
      working-directory: ./android
      env:
        STORE_KEY: ${{ steps.write_key.outputs.filePath }}
        STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        STORE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_STORE_KEY_ALIAS }}
        STORE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    tags:
    - '*'
    branches:
    - master
    - ci-tests/**
